# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        cd tic-tac-toe/
        echo "Current directory is now $(pwd)"
        npm install
        echo "Install package successfully"
        npm run build
        echo "Build successfully"
        echo "Directory structure after build:"
        ls -la
      displayName: 'npm install and build'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'tic-tac-toe/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive build files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'
      displayName: 'Publish artifacts'

- stage: Deploy
  dependsOn: Build
  jobs:
  - deployment: DeployToVM
    environment:
      name: 'New environment'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
            
          - powershell: |
              if (-not (Test-Path -Path "C:\inetpub\wwwroot\tic-tac-toe")) {
                  New-Item -ItemType Directory -Path "C:\inetpub\wwwroot\tic-tac-toe" -Force
              }
              
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::ExtractToDirectory("$(Pipeline.Workspace)\drop\$(Build.BuildId).zip", "C:\inetpub\wwwroot\tic-tac-toe", $true)
              
              Write-Host "Deployment completed successfully"
            displayName: 'Deploy to VM'